name: CI — Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: madfam-org

jobs:
  # ── Lint & Test ──────────────────────────────────────────────────────────────
  test-api:
    name: API — Lint & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/

      - name: Type check (mypy)
        run: mypy src/eido_api/ --ignore-missing-imports

      - name: Test
        run: pytest tests/ -v --cov=eido_api --cov-report=term-missing

  test-services:
    name: Services — Pipeline Stage Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy pytest

      - name: Test spz-compress
        run: pytest services/spz-compress/tests/ -v

      # media-prep's geo module decides whether a capture is georeferenced at
      # all, which gates the entire Eido→Factlas seam. Pure functions — no
      # ffmpeg, S3 or COLMAP needed to run them.
      - name: Test media-prep (georeference extraction)
        run: pytest services/media-prep/tests/ -v

  test-web:
    name: Web — Lint & Build Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — action-setup@v4
      # errors when both specify a version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      # Image-optimizer invariant (GHSA-2xp9-vwfh-vxw4): unoptimized, exact
      # remotePatterns, no next/image imports. Node's built-in runner, no deps.
      - name: Config guard (next.config.js)
        run: pnpm test

  # ── Build & Push Images ──────────────────────────────────────────────────────
  build-api:
    name: Build API Image
    runs-on: ubuntu-24.04
    needs: [test-api]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The eido namespace enforces verify-image-signatures (Kyverno);
      # unsigned images are admission-denied.
      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-api@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so the deploy job"
            echo "::error::never pins it and ArgoCD is never handed a new digest: the live host is"
            echo "::error::still serving the PREVIOUS build even though this commit is on main."
            echo "::error::Rerun the failed jobs (gh run rerun <run-id> --failed)."
            exit 1
          fi

  build-web:
    name: Build Web Image
    runs-on: ubuntu-24.04
    needs: [test-web]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-web@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so the deploy job"
            echo "::error::never pins it and ArgoCD is never handed a new digest: the live host is"
            echo "::error::still serving the PREVIOUS build even though this commit is on main."
            echo "::error::Rerun the failed jobs (gh run rerun <run-id> --failed)."
            exit 1
          fi

  build-orchestration:
    name: Build Orchestration Image
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-orchestration
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/orchestration/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-orchestration@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so the deploy job"
            echo "::error::never pins it and ArgoCD is never handed a new digest: the live host is"
            echo "::error::still serving the PREVIOUS build even though this commit is on main."
            echo "::error::Rerun the failed jobs (gh run rerun <run-id> --failed)."
            exit 1
          fi

  # Stage 0 of the pipeline. Built here — unlike the four GPU stage images,
  # which are still unbuilt pending GPU capacity — because it is CPU-only and
  # is what makes an uploaded video or zip usable and georeferenced at all.
  build-media-prep:
    name: Build Media-Prep Image
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-media-prep
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: services/media-prep
          file: services/media-prep/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Retry the sign call: GitHub's OIDC endpoint transiently returns
      # non-JSON ("invalid character 'u' looking for beginning of value"),
      # which killed crea-frontend run 33010085743 on 2026-08-26 after the
      # image was already built and pushed.
      - name: Sign image with cosign
        id: sign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.ORG }}/eido-media-prep@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so the eido"
            echo "::error::namespace's verify-image-signatures Kyverno policy will admission-deny it."
            echo "::error::Rerun the failed jobs (gh run rerun <run-id> --failed)."
            exit 1
          fi

  # ── Mirror third-party images into ghcr.io/madfam-org ───────────────────────
  # Kyverno denies docker.io images in application namespaces (admission
  # webhook validate.kyverno.svc-fail on the eido-redis Deployment) and the
  # namespace enforces cosign signatures. Mirroring preserves the digest
  # (same manifest, new repo), so redis.yaml pins the identical sha.
  mirror-redis:
    name: Mirror redis to GHCR
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      id-token: write # cosign keyless signing
    env:
      REDIS_DIGEST: sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Mirror + sign (skip if digest already present)
        run: |
          TARGET=ghcr.io/${{ env.ORG }}/eido-redis
          if docker manifest inspect "$TARGET@$REDIS_DIGEST" >/dev/null 2>&1; then
            echo "already mirrored"
          else
            # imagetools create copies the whole multi-arch INDEX, preserving
            # its digest. A plain pull@digest + tag + push dereferences to a
            # single-platform manifest (different sha), so the cluster got
            # NotFound for the index digest the deployment pins.
            docker buildx imagetools create --tag "$TARGET:7-alpine" "redis@$REDIS_DIGEST"
          fi
          # Retry the sign call: GitHub's OIDC endpoint transiently returns
          # non-JSON ("invalid character 'u' looking for beginning of value"),
          # which killed crea-frontend run 33010085743 on 2026-08-26.
          IMAGE_REF="$TARGET@$REDIS_DIGEST"
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The mirrored redis digest is NOT signed, so the eido namespace's"
            echo "::error::verify-image-signatures Kyverno policy will admission-deny it."
            echo "::error::Rerun the failed jobs (gh run rerun <run-id> --failed)."
            exit 1
          fi

  # ── Deploy (GitOps) ──────────────────────────────────────────────────────────
  # Pins the three image digests directly into the deployment manifests in ONE
  # commit; ArgoCD (registered by `enclii onboard`) reconciles them onto the
  # cluster. Digests live in the RAW files (not a kustomization images block)
  # because the Enclii onboarding gate and Kyverno's require-image-digest
  # policy both inspect raw manifests. No ENCLII_TOKEN needed.
  deploy:
    name: Pin digests (ArgoCD deploys)
    runs-on: ubuntu-24.04
    needs: [build-api, build-web, build-orchestration]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit image digests
        id: pin
        run: |
          git config user.name "madfam-bot"
          git config user.email "bot@madfam.dev"
          pin() { # pin <file> <image-name> <digest>
            sed -i -E "s|image: $2[@:][^\"]*|image: $2@$3|" "$1"
          }
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pin infra/k8s/production/api-deployment.yaml           ghcr.io/${{ env.ORG }}/eido-api           ${{ needs.build-api.outputs.digest }}
            pin infra/k8s/production/web-deployment.yaml           ghcr.io/${{ env.ORG }}/eido-web           ${{ needs.build-web.outputs.digest }}
            pin infra/k8s/production/orchestration-deployment.yaml ghcr.io/${{ env.ORG }}/eido-orchestration ${{ needs.build-orchestration.outputs.digest }}
            git add infra/k8s/production/*-deployment.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            # [skip ci] breaks the build->pin->build loop; ArgoCD deploys
            # straight from this manifest commit.
            git commit -m "deploy: pin image digests to ${GITHUB_SHA::8} [skip ci]"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 10))
          done
          echo "Failed after 3 attempts"
          exit 1

      - name: Smoke test (waits out ArgoCD reconcile + rollout)
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 https://api.eido.cam/health | jq .; then
              echo "✅ api.eido.cam is live"
              exit 0
            fi
            echo "not up yet ($i/20) — retrying in 20s"
            sleep 20
          done
          echo "::warning::api.eido.cam did not answer within ~7 min (first deploy: NS propagation or ArgoCD interval may still be settling)"
          exit 1

      # Loud-stale guard (2026-08-26 crea-frontend OIDC incident): a build that
      # pushes an image but dies before the digest lands leaves main green while
      # the cluster keeps the old build. Name that failure mode explicitly.
      # Note this runs only if the deploy job itself started; if a build job's
      # cosign sign failed, deploy is skipped and its own red is the signal.
      - name: Fail loudly if images pushed but not pinned
        if: always()
        run: |
          if [ "${{ steps.pin.outcome }}" != "success" ]; then
            echo "::error title=Image pushed but NOT pinned/deployed::The eido images for ${{ github.sha }} were built and pushed to GHCR, but the digest pin commit did not complete. ArgoCD was never handed a new digest, so THE LIVE HOST IS STILL SERVING THE PREVIOUS BUILD even though this commit is green on main. Rerun the failed jobs (gh run rerun ${{ github.run_id }} --failed)."
            exit 1
          fi
